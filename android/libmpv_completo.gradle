// libmpv completo (mpv + ffmpeg com filtros: bwdif, yadif...) do mpv-android, no lugar do libmpv
// "minimo" do media_kit_libs_android_video (ffmpeg com --disable-filters, sem desentrelacador).
//
// Descarrega (uma vez, fica em build/) os APKs "default" do release 2026-09-17 de
// https://github.com/mpv-android/mpv-android, verifica o SHA-256 e tira deles as lib/<abi>/*.so
// (libmpv, libavcodec, libavfilter, ...). Nao vai no repositorio (~30 MB por ABI).
// Ver third_party/libmpv_completo/LEIA-ME.md.
import java.security.MessageDigest
import java.util.zip.ZipFile

// Para comparar com o libmpv minimo do media_kit: ORG_GRADLE_PROJECT_libmpvMinimo=1 flutter build apk ...
if (project.hasProperty("libmpvMinimo")) return

def release = "2026-09-17"
def apks = [
    "arm64-v8a"  : ["app-default-arm64-v8a-release.apk", "0b0e0a534dd6b8d2b117f06952e0600064ad97702e48bff02543e3e32107803d"],
    "armeabi-v7a": ["app-default-armeabi-v7a-release.apk", "30c63f5528530f56cdece5d6466c749976f01bdcd8c8e67ae76e70a54b7243aa"],
    "x86_64"     : ["app-default-x86_64-release.apk", "347cef5d0c2fe76ec95e19685597ad5d208e5309cc0642d51ae656b125ce1d07"],
]
def pasta = new File(rootProject.projectDir, "../build/libmpv-completo")
def pastaJni = new File(pasta, "jniLibs")

def sha256 = { File f ->
    def md = MessageDigest.getInstance("SHA-256")
    f.withInputStream { is ->
        byte[] buf = new byte[1 << 16]
        int n
        while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().encodeHex().toString()
}

def baixar = tasks.register("baixarLibmpvCompleto") {
    outputs.dir(pastaJni)
    doLast {
        apks.each { abi, info ->
            def nome = info[0], esperado = info[1]
            def destino = new File(pastaJni, abi)
            if (new File(destino, "libmpv.so").exists() && new File(destino, ".sha256").exists() &&
                    new File(destino, ".sha256").text.trim() == esperado) return
            def apk = new File(pasta, nome)
            if (!apk.exists() || sha256(apk) != esperado) {
                apk.parentFile.mkdirs()
                def url = "https://github.com/mpv-android/mpv-android/releases/download/${release}/${nome}"
                println "A descarregar o libmpv completo: ${url}"
                apk.withOutputStream { os -> os << new URL(url).openStream() }
                if (sha256(apk) != esperado) {
                    apk.delete()
                    throw new GradleException("SHA-256 errado em ${nome}; apagado. Corra o build de novo.")
                }
            }
            destino.deleteDir()
            destino.mkdirs()
            def zip = new ZipFile(apk)
            try {
                zip.entries().each { e ->
                    if (!e.isDirectory() && e.name.startsWith("lib/${abi}/") && e.name.endsWith(".so")) {
                        new File(destino, new File(e.name).name).withOutputStream { os -> os << zip.getInputStream(e) }
                    }
                }
            } finally {
                zip.close()
            }
            if (!new File(destino, "libmpv.so").exists()) throw new GradleException("${nome} sem lib/${abi}/libmpv.so")
            new File(destino, ".sha256").text = esperado
        }
    }
}

android {
    sourceSets {
        main {
            jniLibs.srcDir(pastaJni)
        }
    }
    packaging {
        jniLibs {
            // o jar do media_kit_libs_android_video traz um libmpv.so seu: fica o completo
            pickFirsts += ["**/libmpv.so"]
            // o JNI do app do mpv-android (is.xyz.mpv.MPVLib): o media_kit não o usa
            excludes += ["**/libplayer.so"]
        }
    }
}

tasks.configureEach { t ->
    if (t.name.startsWith("merge") && t.name.endsWith("JniLibFolders")) t.dependsOn(baixar)
    if (t.name.startsWith("merge") && t.name.endsWith("NativeLibs")) t.dependsOn(baixar)
}
